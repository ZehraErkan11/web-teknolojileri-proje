<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap | Zehra Erkan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script>
        function dogrula() {
            // Formdaki değerleri alıyoruz ve PHP'deki strtolower() gibi küçük harfe çeviriyoruz
            var email = document.forms["loginForm"]["email"].value.trim().toLowerCase();
            var sifre = document.forms["loginForm"]["sifre"].value.trim().toLowerCase();
            var hataGosterimi = document.getElementById("hataMesajiAlani");

            // Her tıklamada eski hata mesajını gizle
            hataGosterimi.style.display = "none";

            // 1. Boş alan kontrolü
            if (email == "" || sifre == "") {
                alert("E-posta ve şifre alanları boş bırakılamaz!");
                return false; 
            }

            // 2. Mail formatı kontrolü 
            if (!email.includes("@sakarya.edu.tr")) {
                alert("Lütfen geçerli bir Sakarya Üniversitesi mail adresi giriniz!");
                return false;
            }

            // 3. Şifre formatı kontrolü (b + 9 rakam)
            if (sifre.length !== 10 || sifre.charAt(0) !== 'b') {
                alert("Şifreniz 'b' ile başlamalı ve toplam 10 karakter olmalıdır!");
                return false;
            }


            
            // 4. GİRİŞ KONTROLÜ
            var beklenen_mail = sifre + "@sakarya.edu.tr";

            // Eğer mail beklenen maile EŞİT DEĞİLSE (!==) hata ver ve durdur
            if (email !== beklenen_mail)
             {
                hataGosterimi.style.display = "block";
                hataGosterimi.innerText = "Hatalı giriş! Kullanıcı adınız ile şifreniz eşleşmiyor.";
                return false;
            }

            // Üstteki if bloğuna takılmadıysa (hata yoksa) formu doğrudan POST et
            return true;
        }
    </script>
</head>

</nav>

<div class="container mt-5">
    <div class="yazi-alani shadow-lg mx-auto p-5" style="max-width: 500px; border-radius: 20px;">
        <h2 class="text-center el-yazisi mb-4" style="color: #5d6841;">Giriş Paneli</h2>

        <!-- JS ile kontrol edilecek hata mesajı alanı (Başlangıçta gizli) -->
        <div id="hataMesajiAlani" class="alert alert-danger text-center small" style="display: none;"></div>

        <!-- action kısmını boş bıraktık çünkü yönlendirmeyi JS yapacak -->
        <form name="loginForm" action="basarili.php" method="POST" onsubmit="return dogrula()">
            <div class="mb-3">
                <label class="form-label fw-bold">E-posta</label>
                <input type="text" class="form-control" name="email" placeholder="b241210001@sakarya.edu.tr">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Şifre</label>
                <input type="password" class="form-control" name="sifre" placeholder="b241210001">
            </div>
            <button type="submit" class="buton-basit w-100 border-0 p-2" style="background-color: #8a966a; color: white;">
                Giriş Yap
            </button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

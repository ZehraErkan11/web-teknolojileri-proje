<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap | Zehra Erkan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script>
        function dogrula() {
            var email = document.forms["loginForm"]["email"].value.trim();
            var sifre = document.forms["loginForm"]["sifre"].value.trim();

            if (email == "" || sifre == "") {
                alert("E-posta ve şifre alanları boş bırakılamaz!");
                return false; 
            }
            if (!email.endsWith("@sakarya.edu.tr")) {
                alert("Lütfen geçerli bir Sakarya Üniversitesi mail adresi giriniz!");
                return false;
            }
            return true; 
        }
    </script>
</head>
<body>

<div class="ust-banner"></div>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="#">Zehra Erkan</a>

         <!-- Hamburger Menü Butonu  -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarZehra" aria-controls="navbarZehra" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse" id="navbarZehra">
            <div class="navbar-nav ms-auto">
                 <a class="nav-link" href="index.html">Hakkında</a>

                <a class="nav-link active" href="login.html">Giriş Yap</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="yazi-alani shadow-lg mx-auto p-5" style="max-width: 500px; border-radius: 20px;">
        <h2 class="text-center el-yazisi mb-4" style="color: #5d6841;">Giriş Paneli</h2>

        <div id="hataMesaji" class="alert alert-danger text-center small" style="display:none;">Hatalı Giriş!</div>

        <form name="loginForm" action="basarili.php" method="POST" onsubmit="return dogrula()">
            <div class="mb-3">
                <label class="form-label fw-bold">E-posta</label>
                <input type="text" class="form-control" name="email" placeholder="b251210002@sakarya.edu.tr">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Şifre</label>
                <input type="password" class="form-control" name="sifre" placeholder="b251210002">
            </div>
            <button type="submit" class="buton-basit w-100 border-0 p-2" style="background-color: #8a966a; color: white;">
                Giriş Yap
            </button>
        </form>
    </div>
</div>

<script>
    // Eğer URL'de hata=1 varsa hata mesajını göster 
    if(window.location.search.includes("hata=1")) {
        document.getElementById("hataMesaji").style.display = "block";
    }
</script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
